name: Release

on:
  push:
    tags:
      - "mac-*"
      - "iOS-*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-release:
    name: macOS Release
    runs-on: macos-26
    if: startsWith(github.ref_name, 'mac-')
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Generate Secrets Sources
        run: PROJECT_DIR="$GITHUB_WORKSPACE" ./buildscripts/updateSecrets.sh

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Resolve version
        id: version
        run: |
          version="${GITHUB_REF_NAME#mac-}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Archive DashNews
        run: |
          set -euo pipefail
          xcodebuild \
            -project DashNews.xcodeproj \
            -scheme DashNews \
            -configuration Release \
            -destination "platform=macOS,arch=arm64" \
            -archivePath "$RUNNER_TEMP/DashNews.xcarchive" \
            -xcconfig .github/macos-ci-no-signing.xcconfig \
            archive 2>&1 | xcbeautify --renderer github-actions

      - name: Package DashNews.app
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/DashNews.xcarchive/Products/Applications/DashNews.app"
          test -d "$app"
          cd "$RUNNER_TEMP/DashNews.xcarchive/Products/Applications"
          ditto -c -k --keepParent "DashNews.app" "$RUNNER_TEMP/DashNews${{ steps.version.outputs.version }}.zip"

      - name: Create release and upload asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --generate-notes --latest=false
          fi
          gh release upload "${GITHUB_REF_NAME}" "$RUNNER_TEMP/DashNews${{ steps.version.outputs.version }}.zip" --clobber

  ios-release:
    name: iOS Archive
    runs-on: macos-26
    if: startsWith(github.ref_name, 'iOS-')
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Generate Secrets Sources
        run: PROJECT_DIR="$GITHUB_WORKSPACE" ./buildscripts/updateSecrets.sh

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Resolve version
        id: version
        run: |
          # Tag form: iOS-<marketing>-<build>
          tag="${GITHUB_REF_NAME#iOS-}"
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: Archive DashNews-iOS
        run: |
          set -euo pipefail
          xcodebuild \
            -project DashNews.xcodeproj \
            -scheme DashNews-iOS \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/DashNews-iOS.xcarchive" \
            -xcconfig .github/ios-ci-no-signing.xcconfig \
            archive 2>&1 | xcbeautify --renderer github-actions

      - name: Package xcarchive
        run: |
          set -euo pipefail
          test -d "$RUNNER_TEMP/DashNews-iOS.xcarchive"
          ditto -c -k --keepParent "$RUNNER_TEMP/DashNews-iOS.xcarchive" "$RUNNER_TEMP/DashNews-iOS-${{ steps.version.outputs.version }}.zip"

      - name: Create release and upload asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --generate-notes --latest=false
          fi
          gh release upload "${GITHUB_REF_NAME}" "$RUNNER_TEMP/DashNews-iOS-${{ steps.version.outputs.version }}.zip" --clobber
