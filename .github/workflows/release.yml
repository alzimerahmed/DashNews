name: Release

on:
  push:
    tags:
      - "mac-*"
      - "iOS-*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-release:
    name: macOS Release
    runs-on: macos-26
    if: startsWith(github.ref_name, 'mac-')
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Generate Secrets Sources
        run: PROJECT_DIR="$GITHUB_WORKSPACE" ./buildscripts/updateSecrets.sh

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Resolve version
        id: version
        run: |
          version="${GITHUB_REF_NAME#mac-}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build DashNews (unsigned Release)
        run: |
          set -euo pipefail
          # Unsigned-style release zip — the appcast already ships unsigned
          # enclosures. App extensions still need *a* signature for the
          # embedded-binary validation step, so sign ad-hoc ("-"): the
          # result verifies like an unsigned app under Gatekeeper.
          build_log="$RUNNER_TEMP/DashNews-release-build.log"
          if ! xcodebuild \
            -project DashNews.xcodeproj \
            -scheme DashNews \
            -configuration Release \
            -destination "platform=macOS,arch=arm64" \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            -xcconfig .github/macos-ci-no-signing.xcconfig \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            'CODE_SIGN_IDENTITY[sdk=macosx*]=-' \
            build 2>&1 | tee "$build_log" | xcbeautify --renderer github-actions; then
            echo "::error::xcodebuild failed — last 100 lines of raw log:"
            tail -100 "$build_log"
            exit 1
          fi

      - name: Package DashNews.app
        run: |
          set -euo pipefail
          app_dir="$(find "$RUNNER_TEMP/derived/Build/Products/Release" -maxdepth 1 -name "DashNews.app" -type d)"
          test -d "$app_dir"
          ditto -c -k --keepParent "$app_dir" "$RUNNER_TEMP/DashNews${{ steps.version.outputs.version }}.zip"

      - name: Create release and upload asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --generate-notes --latest=false
          fi
          gh release upload "${GITHUB_REF_NAME}" "$RUNNER_TEMP/DashNews${{ steps.version.outputs.version }}.zip" --clobber

  ios-release:
    name: iOS Archive
    runs-on: macos-26
    if: startsWith(github.ref_name, 'iOS-')
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Generate Secrets Sources
        run: PROJECT_DIR="$GITHUB_WORKSPACE" ./buildscripts/updateSecrets.sh

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Resolve version
        id: version
        run: |
          # Tag form: iOS-<marketing>-<build>
          tag="${GITHUB_REF_NAME#iOS-}"
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: Archive DashNews-iOS
        run: |
          set -euo pipefail
          xcodebuild \
            -project DashNews.xcodeproj \
            -scheme DashNews-iOS \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/DashNews-iOS.xcarchive" \
            -xcconfig .github/ios-ci-no-signing.xcconfig \
            archive 2>&1 | xcbeautify --renderer github-actions

      - name: Package xcarchive
        run: |
          set -euo pipefail
          test -d "$RUNNER_TEMP/DashNews-iOS.xcarchive"
          ditto -c -k --keepParent "$RUNNER_TEMP/DashNews-iOS.xcarchive" "$RUNNER_TEMP/DashNews-iOS-${{ steps.version.outputs.version }}.zip"

      - name: Create release and upload asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --generate-notes --latest=false
          fi
          gh release upload "${GITHUB_REF_NAME}" "$RUNNER_TEMP/DashNews-iOS-${{ steps.version.outputs.version }}.zip" --clobber
